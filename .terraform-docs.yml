formatter: markdown table
output:
  file: docs.md
  mode: inject
content: |-
  {{ .Header }}
  {{ .Providers }}
  {{ .Requirements }}
  {{ .Inputs }}
  {{ .Outputs }}
  {{ .Modules }}
  {{ .Resources }}
  {{ .Footer }}
sort:
  enabled: true
  by: name
settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: true
  html: true
  indent: 2
  lockfile: true
  read-comments: true
